<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자동 과제 평가 서비스 - 메인</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="logo-container" onclick="location.href='main-screen.html'">
      <div class="logo-icon">📝</div>
      <span>과제 평가 서비스</span>
    </div>
    <div class="user-info">
      <span id="userRoleTag" class="user-tag">로딩 중...</span>
      <span id="userName" style="font-weight: 500; font-size: 0.95rem;">로딩 중...</span>
      <button class="btn btn-secondary btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">개설 강좌 목록</h1>
        <p style="color: var(--text-muted); margin-top: 0.25rem;">수강하거나 관리하는 강좌 목록을 확인하고 이동합니다.</p>
      </div>
      <!-- 교수용 강좌 생성 버튼 -->
      <button id="btnCreateCourse" class="btn btn-primary" style="display: none;" onclick="openCreateModal()">
        <span>+ 강좌 개설</span>
      </button>
    </div>

    <!-- 강좌 목록 카드 영역 -->
    <div id="courseContainer"
      style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
      <!-- 강좌 카드들이 동적으로 추가됨 -->
    </div>
  </div>

  <!-- 강좌 생성 모달 (교수용) -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">새 강좌 개설</h3>
        <button class="close-btn" onclick="closeCreateModal()">&times;</button>
      </div>
      <form id="createCourseForm">
        <div class="form-group">
          <label class="form-label" for="newCourseTitle">강좌 이름</label>
          <input type="text" id="newCourseTitle" class="form-control" placeholder="예: 컴퓨터 프로그래밍 및 실습" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newCourseDesc">강좌 설명</label>
          <textarea id="newCourseDesc" class="form-control" rows="4" placeholder="강좌의 개요 및 목표를 작성해 주세요."
            required></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">취소</button>
          <button type="submit" class="btn btn-primary">개설</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 강좌 수정 모달 (교수용) -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">강좌 수정</h3>
        <button class="close-btn" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editCourseForm">
        <input type="hidden" id="editCourseId">
        <div class="form-group">
          <label class="form-label" for="editCourseTitle">강좌 이름</label>
          <input type="text" id="editCourseTitle" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="editCourseDesc">강좌 설명</label>
          <textarea id="editCourseDesc" class="form-control" rows="4" required></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    // 사용자 상태 정보 가져오기 및 세션 검증
    async function checkAuth() {
      try {
        const response = await fetch('/api/me');
        if (!response.ok) {
          window.location.href = 'index.html';
          return;
        }
        const data = await response.json();
        currentUser = data.user;

        // 상단 정보 업데이트
        document.getElementById('userName').textContent = `${currentUser.name} 님`;
        const roleTag = document.getElementById('userRoleTag');
        if (currentUser.role === 'professor') {
          roleTag.textContent = '교수';
          roleTag.style.backgroundColor = 'var(--primary-light)';
          roleTag.style.color = 'var(--primary)';
          // 교수용 강좌 생성 버튼 노출
          document.getElementById('btnCreateCourse').style.display = 'inline-flex';
        } else {
          roleTag.textContent = '학생';
          roleTag.style.backgroundColor = 'var(--success-light)';
          roleTag.style.color = 'var(--success)';
        }

        // 강좌 목록 로드
        loadCourses();
      } catch (err) {
        console.error(err);
        window.location.href = 'index.html';
      }
    }

    // 로그아웃 처리
    async function logout() {
      try {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = 'index.html';
      } catch (err) {
        alert('로그아웃에 실패했습니다.');
      }
    }

    // 강좌 목록 불러오기 API 연동
    async function loadCourses() {
      const container = document.getElementById('courseContainer');
      container.innerHTML = '<p style="color: var(--text-light);">강좌 목록을 불러오는 중...</p>';

      try {
        const response = await fetch('/api/courses');
        if (!response.ok) throw new Error('Failed to fetch courses');
        const courses = await response.json();

        if (courses.length === 0) {
          container.innerHTML = '<p style="color: var(--text-light); grid-column: 1/-1; text-align: center; padding: 3rem 0;">개설된 강좌가 없습니다.</p>';
          return;
        }

        container.innerHTML = '';
        courses.forEach(course => {
          const card = document.createElement('div');
          card.className = 'card';

          // 교수인 경우 수정 버튼 렌더링
          let actionsHtml = `
            <div style="display: flex; gap: 0.5rem;">
              <a href="lecture.html?id=${course.id}" class="btn btn-primary btn-sm">이동</a>
          `;
          if (currentUser && currentUser.role === 'professor') {
            actionsHtml += `
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${course.id}, '${escapeHtml(course.title)}', '${escapeHtml(course.description)}')">수정</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCourse(${course.id})">삭제</button>
            `;
          }
          actionsHtml += `</div>`;

          card.innerHTML = `
            <h3 class="card-title">${escapeHtml(course.title)}</h3>
            <p class="card-desc" style="min-height: 48px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${escapeHtml(course.description)}</p>
            ${actionsHtml}
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="color: var(--danger); text-align: center; grid-column: 1/-1;">강좌 목록을 불러오지 못했습니다.</p>';
      }
    }

    // 강좌 생성 모달 제어
    function openCreateModal() {
      const modal = document.getElementById('createModal');
      modal.classList.add('active');
    }

    function closeCreateModal() {
      const modal = document.getElementById('createModal');
      modal.classList.remove('active');
      document.getElementById('createCourseForm').reset();
    }

    // 강좌 생성 처리
    document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('newCourseTitle').value;
      const description = document.getElementById('newCourseDesc').value;

      try {
        const response = await fetch('/api/courses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, description })
        });

        if (response.ok) {
          closeCreateModal();
          loadCourses(); // 목록 새로고침
        } else {
          const data = await response.json();
          alert(data.error || '강좌 개설에 실패했습니다.');
        }
      } catch (err) {
        alert('서버 통신에 실패했습니다.');
      }
    });

    // 강좌 수정 모달 제어
    function openEditModal(id, title, description) {
      document.getElementById('editCourseId').value = id;
      document.getElementById('editCourseTitle').value = title;
      document.getElementById('editCourseDesc').value = description;

      const modal = document.getElementById('editModal');
      modal.classList.add('active');
    }

    function closeEditModal() {
      const modal = document.getElementById('editModal');
      modal.classList.remove('active');
      document.getElementById('editCourseForm').reset();
    }

    // 강좌 수정 처리
    document.getElementById('editCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editCourseId').value;
      const title = document.getElementById('editCourseTitle').value;
      const description = document.getElementById('editCourseDesc').value;

      try {
        const response = await fetch(`/api/courses/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, description })
        });

        if (response.ok) {
          closeEditModal();
          loadCourses(); // 목록 새로고침
        } else {
          const data = await response.json();
          alert(data.error || '강좌 수정에 실패했습니다.');
        }
      } catch (err) {
        alert('서버 통신에 실패했습니다.');
      }
    });

    // 강좌 삭제 처리
    async function deleteCourse(id) {
      if (!confirm('정말로 이 강좌를 삭제하시겠습니까?\n이 강좌와 관련된 모든 과제, 제출, 평가 데이터가 영구적으로 삭제됩니다.')) {
        return;
      }

      try {
        const response = await fetch(`/api/courses/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert('강좌가 성공적으로 삭제되었습니다.');
          loadCourses(); // 목록 새로고침
        } else {
          const data = await response.json();
          alert(data.error || '강좌 삭제에 실패했습니다.');
        }
      } catch (err) {
        alert('서버 통신에 실패했습니다.');
      }
    }

    // HTML 특수기호 이스케이프
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 페이지 로드 시 세션 체크
    window.onload = checkAuth;
  </script>
</body>

</html>
